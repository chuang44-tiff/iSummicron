name: CI

# Triggers: pushes to main, pull requests, and manual runs. Public repos get free
# macOS runner minutes. G1/ON bench md5 gates need the dev-only sample image and
# are not run here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # arm64 runner. Pinned label, NOT macos-latest (it will migrate).
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # An accidental model fetch fails fast instead of hanging.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Editable: tests/conftest.py requires summicron to import from the checkout.
      - name: Install
        run: python -m pip install -e ".[heic,depth,hdr-macos,eval-quality,dev]"

      - name: Provenance
        run: python -c "import platform, sys, summicron, Quartz; print(platform.mac_ver(), sys.version, summicron.__file__)"

      - name: Lint
        run: ruff check summicron/

      - name: FAST suite
        run: python -m pytest tests/ -m "not slow" -p no:xdist -q -rs --durations=15
