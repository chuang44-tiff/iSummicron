[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isummicron"
version = "0.2.0"
description = "Spatially-varying PSF bokeh renderer — applies a 4D PSF tensor to your image. Ships with a simulated double-gauss 50mm f/2 PSF."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "iSummicron contributors" }]
keywords = ["bokeh", "psf", "computational-photography", "depth", "lens-blur"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pillow>=10.0"]

[project.optional-dependencies]
heic      = ["pillow-heif>=0.14"]
depth     = ["torch>=2.1", "transformers>=4.40"]
hdr-macos = [
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-CoreImage; sys_platform == 'darwin'",
]

[project.scripts]
isummicron = "summicron.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["summicron"]

[tool.hatch.build.targets.wheel.force-include]
"summicron/_artifacts/codev_render_v1.npz" = "summicron/_artifacts/codev_render_v1.npz"
